# Optional N4 compatibility profile; the ordinary benchmark keeps its advisory limit.
config_paths:
- benchmarks/opencode_multimodal_benchmarks/vtcbench/opencode.yaml

visual_agent:
  responses_api_agents:
    opencode_agent:
      opencode_config:
        agent:
          build:
            steps: null

policy_model:
  responses_api_models:
    vllm_model:
      num_workers: 1
      turn_budget:
        regular_turns: 55
        grace_turns: 10
        grace_tool_turns: 2
        grace_tool_calls: 2
        max_rollouts: 10000

rollout_correlation: true
